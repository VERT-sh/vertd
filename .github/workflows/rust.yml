name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # macOS (github-hosted)
          - os: macos-latest
            friendly-name: mac-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            friendly-name: mac-x86_64
            target: x86_64-apple-darwin
          # Linux (github-hosted)
          - os: ubuntu-latest
            friendly-name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          # Windows Cross-Compile on Linux (github-hosted)
          - os: ubuntu-latest
            friendly-name: windows-x86_64
            target: x86_64-pc-windows-gnu
            format: ".exe"
            use-mingw: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW (for Windows target)
        if: matrix.use-mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: target/${{ matrix.target }}/release/vertd${{ matrix.format }}
          name: vertd-${{ matrix.friendly-name }}${{ matrix.format }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Move and rename artifacts
        run: |
          mkdir -p artifacts/output
          for dir in artifacts/vertd-*; do
            [ -d "$dir" ] || continue
            bin_name=$(basename "$dir")
            mv "$dir"/* "artifacts/output/$bin_name"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.sha }}
          name: "Nightly build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: artifacts/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

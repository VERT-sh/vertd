[package]
name = "vertd"
version = "0.1.0"
edition = "2021"

[lints.clippy]
upper_case_acronyms = "allow"

[dependencies]
actix-cors = "0.7.0"
actix-multipart = "0.8.5"
actix-web = "4.9.0"
actix-ws = "0.4.0"
anyhow = "1.0.95"
discord-webhook2 = "0.4.3"
dotenv = "0.15.0"
env_logger = "0.11.6"
futures-util = "0.3.31"
hex = "0.4.3"
lazy_static = "1.5.0"
log = "0.4.25"
natord = "1.0.9"
once_cell = "1.21.3"
rand = "0.10.3"
rbtag = "0.3.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
socket2 = "0.5"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "process",
    "fs",
    "io-util",
] }
tokio-util = "0.7.17"
uuid = { version = "1.13.1", features = ["v4", "fast-rng", "serde"] }
wgpu = "30.0.1"
zip = { version = "9.0.0", default-features = false, features = [
    "deflate",
    "deflate64",
    "bzip2",
    "lzma",
    "xz",
    "ppmd",
    "zstd",
] }
